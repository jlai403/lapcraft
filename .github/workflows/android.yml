name: Android

on:
  push:
    branches: ["main"]
    tags: ["v*"]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  # No paths filter: the required checks (android-test, android-build) must
  # report on every PR, including ones that only touch site/.
  pull_request:
  workflow_dispatch:
    inputs:
      promote_minor:
        description: "Minor line to promote (resolves to its newest prerelease)"
        type: choice
        options:
          - v0.2
        default: v0.2
      promote_tag:
        description: "Optional exact tag (overrides the dropdown)"
        required: false

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: android-test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v4

      - uses: actions/cache@v4
        with:
          path: |
            ~/.android
            ${{ env.ANDROID_HOME }}/platforms
            ${{ env.ANDROID_HOME }}/build-tools
          key: android-sdk-${{ runner.os }}-36

      - name: Install SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - uses: gradle/actions/setup-gradle@v6

      - name: Unit and Compose UI tests
        run: ./gradlew :core:test :app:testDebugUnitTest --stacktrace

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-${{ github.sha }}
          path: |
            android/app/build/reports/tests/testDebugUnitTest
            android/app/build/test-results/testDebugUnitTest

  build:
    name: android-build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v4

      - uses: actions/cache@v4
        with:
          path: |
            ~/.android
            ${{ env.ANDROID_HOME }}/platforms
            ${{ env.ANDROID_HOME }}/build-tools
          key: android-sdk-${{ runner.os }}-36

      - name: Install SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - uses: gradle/actions/setup-gradle@v6

      - name: Lint
        run: ./gradlew :app:lintDebug --stacktrace

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_SHA: ${{ github.sha }}

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: lint-build-reports-${{ github.sha }}
          path: android/app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

  release:
    name: android-release
    # Signed artifacts only from main, tags and manual runs. PRs and feature
    # branches build the debug variant above and never see the release key.
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: android
    defaults:
      run:
        working-directory: android

    outputs:
      version_code: ${{ steps.version.outputs.version_code }}
      version_name: ${{ steps.version.outputs.version_name }}
      version_tag: ${{ steps.version.outputs.version_tag }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v4

      - uses: actions/cache@v4
        with:
          path: |
            ~/.android
            ${{ env.ANDROID_HOME }}/platforms
            ${{ env.ANDROID_HOME }}/build-tools
          key: android-sdk-${{ runner.os }}-36

      - name: Install SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - uses: gradle/actions/setup-gradle@v6

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "KEYSTORE_BASE64 secret is required" >&2
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > ci/release.keystore

      - name: Build APKs
        run: ./gradlew :app:assembleStable :app:assemblePreview --stacktrace
        env:
          LAPCRAFT_KEYSTORE: ${{ github.workspace }}/android/ci/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ vars.KEY_ALIAS || secrets.KEY_ALIAS || 'lapcraft' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_SHA: ${{ github.sha }}

      - name: Verify release APKs
        run: bash ci/verify-release.sh app/build/outputs/apk/stable/app-stable.apk app/build/outputs/apk/preview/app-preview.apk

      - name: Remove release keystore
        if: always()
        run: rm -f ci/release.keystore

      - name: Compute version
        id: version
        run: |
          count=$(git rev-list --count HEAD)
          version_name="0.2.${count}"
          version_code=$((1000 + count))
          echo "version_name=$version_name" >> "$GITHUB_OUTPUT"
          echo "version_code=$version_code" >> "$GITHUB_OUTPUT"
          echo "version_tag=v${version_name}" >> "$GITHUB_OUTPUT"
          [[ "$version_name" =~ ^0\.2\.[0-9]+$ ]] || { echo "bad version $version_name"; exit 1; }

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: lapcraft-debug-${{ github.sha }}
          path: |
            android/app/build/outputs/apk/stable/app-stable.apk
            android/app/build/outputs/apk/preview/app-preview.apk
          if-no-files-found: error

  preview:
    name: android-preview
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, release]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download APK
        uses: actions/download-artifact@v8
        with:
          name: lapcraft-debug-${{ github.sha }}
          path: dist

      - name: Stage files
        run: |
          mkdir -p dist
          preview=$(find dist -name 'app-preview.apk' | head -1)
          cp "$preview" dist/LapCraft-preview.apk
          jq -n \
            --argjson code "${{ needs.release.outputs.version_code }}" \
            --arg name "${{ needs.release.outputs.version_name }}" \
            --arg notes "Preview build ${{ github.run_number }} · ${GITHUB_SHA:0:7}" \
            '{versionCode:$code,versionName:$name,notes:$notes}' \
            > dist/latest.json

      - name: Publish per-build prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="${{ needs.release.outputs.version_tag }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/LapCraft-preview.apk dist/latest.json --clobber
          else
            gh release create "$tag" dist/LapCraft-preview.apk dist/latest.json \
              --prerelease --title "Preview ${{ needs.release.outputs.version_name }}" \
              --notes "Preview build ${{ github.run_number }} · ${GITHUB_SHA:0:7}"
          fi

      - name: Refresh rolling manifest
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "preview-latest" >/dev/null 2>&1; then
            gh release upload "preview-latest" dist/latest.json --clobber
          else
            gh release create "preview-latest" dist/latest.json \
              --prerelease --title "Preview builds" \
              --notes "Rolling manifest for the in-app update check."
          fi

      - name: Prune old previews
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release list --limit 100 --json tagName,isPrerelease \
            | jq -r '.[] | select(.isPrerelease and (.tagName | startswith("v0.2."))) | .tagName' \
            | tail -n +11 | while read -r old; do
                # Tags are protected by a ruleset; prune the release only.
                gh release delete "$old" --yes || true
              done

  promote:
    name: android-promote
    if: github.event_name == 'workflow_dispatch' && (github.event.inputs.promote_tag != '' || github.event.inputs.promote_minor != '')
    runs-on: ubuntu-latest
    environment: android
    permissions:
      contents: write

    steps:
      - name: Resolve tag
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [ -n "${{ github.event.inputs.promote_tag }}" ]; then
            tag="${{ github.event.inputs.promote_tag }}"
          else
            minor="${{ github.event.inputs.promote_minor }}"
            tag=$(gh release list --limit 200 --json tagName,isPrerelease \
              --jq "[.[] | select(.isPrerelease and (.tagName | startswith(\"${minor}.\")))] | sort_by(.tagName | ltrimstr(\"${minor}.\") | tonumber) | last | .tagName")
          fi
          [ -n "$tag" ] || { echo "no release found"; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Resolved tag: $tag"

      - name: Checkout tag
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.resolve.outputs.tag }}
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v4

      - uses: actions/cache@v4
        with:
          path: |
            ~/.android
            ${{ env.ANDROID_HOME }}/platforms
            ${{ env.ANDROID_HOME }}/build-tools
          key: android-sdk-${{ runner.os }}-36

      - name: Install SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - uses: gradle/actions/setup-gradle@v6

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "KEYSTORE_BASE64 secret is required" >&2
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/ci/release.keystore

      - name: Build stable APK
        run: cd android && ./gradlew :app:assembleStable --stacktrace
        env:
          LAPCRAFT_KEYSTORE: ${{ github.workspace }}/android/ci/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ vars.KEY_ALIAS || secrets.KEY_ALIAS || 'lapcraft' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_SHA: ${{ github.sha }}

      - name: Verify release APK
        run: bash android/ci/verify-release.sh android/app/build/outputs/apk/stable/app-stable.apk

      - name: Remove release keystore
        if: always()
        run: rm -f android/ci/release.keystore

      - name: Compute version
        id: version
        run: |
          count=$(git rev-list --count HEAD)
          version_name="0.2.${count}"
          version_code=$((1000 + count))
          echo "version_name=$version_name" >> "$GITHUB_OUTPUT"
          echo "version_code=$version_code" >> "$GITHUB_OUTPUT"
          [[ "$version_name" =~ ^0\.2\.[0-9]+$ ]] || { echo "bad version $version_name"; exit 1; }

      - name: Guard tag
        run: |
          if [ "v${{ steps.version.outputs.version_name }}" != "${{ steps.resolve.outputs.tag }}" ]; then
            echo "Tag ${{ steps.resolve.outputs.tag }} does not match versionName ${{ steps.version.outputs.version_name }}"
            exit 1
          fi

      - name: Stage files
        run: |
          mkdir -p dist
          stable=$(find . -path '*/apk/stable/app-stable.apk' | head -1)
          cp "$stable" "dist/LapCraft-${{ steps.version.outputs.version_name }}-${{ steps.version.outputs.version_code }}-release.apk"
          cp "$stable" dist/LapCraft.apk
          jq -n \
            --argjson code "${{ steps.version.outputs.version_code }}" \
            --arg name "${{ steps.version.outputs.version_name }}" \
            --arg notes "Stable build ${{ steps.resolve.outputs.tag }}" \
            '{versionCode:$code,versionName:$name,notes:$notes}' \
            > dist/latest.json

      - name: Publish and promote
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="${{ steps.resolve.outputs.tag }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/*.apk dist/latest.json --clobber
          else
            gh release create "$tag" dist/*.apk dist/latest.json
          fi
          gh release edit "$tag" \
            --title "LapCraft ${{ steps.version.outputs.version_name }}" \
            --notes "Stable build ${{ steps.resolve.outputs.tag }}" \
            --prerelease=false \
            --latest

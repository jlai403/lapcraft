name: Android

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      promote_tag:
        description: "Release tag to rebuild as stable and promote (e.g. v0.2.313)"
        required: false

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v4

      - uses: actions/cache@v4
        with:
          path: |
            ~/.android
            ${{ env.ANDROID_HOME }}/platforms
            ${{ env.ANDROID_HOME }}/build-tools
          key: android-sdk-${{ runner.os }}-36

      - name: Install SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - uses: gradle/actions/setup-gradle@v6

      - name: Unit and Compose UI tests
        run: ./gradlew :core:test :app:testDebugUnitTest --stacktrace

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-${{ github.sha }}
          path: |
            app/build/reports/tests/testDebugUnitTest
            app/build/test-results/testDebugUnitTest

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    outputs:
      version_code: ${{ steps.version.outputs.version_code }}
      version_name: ${{ steps.version.outputs.version_name }}
      version_tag: ${{ steps.version.outputs.version_tag }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v4

      - uses: actions/cache@v4
        with:
          path: |
            ~/.android
            ${{ env.ANDROID_HOME }}/platforms
            ${{ env.ANDROID_HOME }}/build-tools
          key: android-sdk-${{ runner.os }}-36

      - name: Install SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - uses: gradle/actions/setup-gradle@v6

      - name: Lint
        run: ./gradlew :app:lintDebug --stacktrace

      - name: Build APKs
        run: ./gradlew :app:assembleStable :app:assemblePreview --stacktrace
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_SHA: ${{ github.sha }}

      - name: Compute version
        id: version
        run: |
          count=$(git rev-list --count HEAD)
          version_name="0.2.${count}"
          version_code=$((1000 + count))
          echo "version_name=$version_name" >> "$GITHUB_OUTPUT"
          echo "version_code=$version_code" >> "$GITHUB_OUTPUT"
          echo "version_tag=v${version_name}" >> "$GITHUB_OUTPUT"
          [[ "$version_name" =~ ^0\.2\.[0-9]+$ ]] || { echo "bad version $version_name"; exit 1; }

      - name: Upload APK
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: lapcraft-debug-${{ github.sha }}
          path: |
            app/build/outputs/apk/stable/app-stable.apk
            app/build/outputs/apk/preview/app-preview.apk
          if-no-files-found: error

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: lint-build-reports-${{ github.sha }}
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
  preview:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download APK
        uses: actions/download-artifact@v8
        with:
          name: lapcraft-debug-${{ github.sha }}
          path: dist

      - name: Stage files
        run: |
          mkdir -p dist
          preview=$(find dist -name 'app-preview.apk' | head -1)
          cp "$preview" dist/LapCraft-preview.apk
          jq -n \
            --argjson code "${{ needs.build.outputs.version_code }}" \
            --arg name "${{ needs.build.outputs.version_name }}" \
            --arg notes "Preview build ${{ github.run_number }} · ${GITHUB_SHA:0:7}" \
            '{versionCode:$code,versionName:$name,notes:$notes}' \
            > dist/latest.json

      - name: Publish per-build prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="${{ needs.build.outputs.version_tag }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/LapCraft-preview.apk dist/latest.json --clobber
          else
            gh release create "$tag" dist/LapCraft-preview.apk dist/latest.json \
              --prerelease --title "Preview ${{ needs.build.outputs.version_name }}" \
              --notes "Preview build ${{ github.run_number }} · ${GITHUB_SHA:0:7}"
          fi

      - name: Refresh rolling manifest
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "preview-latest" >/dev/null 2>&1; then
            gh release upload "preview-latest" dist/latest.json --clobber
          else
            gh release create "preview-latest" dist/latest.json \
              --prerelease --title "Preview builds" \
              --notes "Rolling manifest for the in-app update check."
          fi

      - name: Prune old previews
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release list --limit 100 --json tagName,isPrerelease \
            | jq -r '.[] | select(.isPrerelease and (.tagName | startswith("v0.2."))) | .tagName' \
            | tail -n +11 | while read -r old; do
                gh release delete "$old" --yes --cleanup-tag || true
              done

  promote:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.promote_tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout tag
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.promote_tag }}
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v4

      - uses: actions/cache@v4
        with:
          path: |
            ~/.android
            ${{ env.ANDROID_HOME }}/platforms
            ${{ env.ANDROID_HOME }}/build-tools
          key: android-sdk-${{ runner.os }}-36

      - name: Install SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - uses: gradle/actions/setup-gradle@v6

      - name: Build stable APK
        run: ./gradlew :app:assembleStable --stacktrace
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_SHA: ${{ github.sha }}

      - name: Compute version
        id: version
        run: |
          count=$(git rev-list --count HEAD)
          version_name="0.2.${count}"
          version_code=$((1000 + count))
          echo "version_name=$version_name" >> "$GITHUB_OUTPUT"
          echo "version_code=$version_code" >> "$GITHUB_OUTPUT"
          [[ "$version_name" =~ ^0\.2\.[0-9]+$ ]] || { echo "bad version $version_name"; exit 1; }

      - name: Guard tag
        run: |
          if [ "v${{ steps.version.outputs.version_name }}" != "${{ github.event.inputs.promote_tag }}" ]; then
            echo "Tag ${{ github.event.inputs.promote_tag }} does not match versionName ${{ steps.version.outputs.version_name }}"
            exit 1
          fi

      - name: Stage files
        run: |
          mkdir -p dist
          stable=$(find . -path '*/apk/stable/app-stable.apk' | head -1)
          cp "$stable" "dist/LapCraft-${{ steps.version.outputs.version_name }}-${{ steps.version.outputs.version_code }}-debug.apk"
          cp "$stable" dist/LapCraft.apk
          jq -n \
            --argjson code "${{ steps.version.outputs.version_code }}" \
            --arg name "${{ steps.version.outputs.version_name }}" \
            --arg notes "Stable build ${{ github.event.inputs.promote_tag }}" \
            '{versionCode:$code,versionName:$name,notes:$notes}' \
            > dist/latest.json

      - name: Publish and promote
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="${{ github.event.inputs.promote_tag }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/*.apk dist/latest.json --clobber
          else
            gh release create "$tag" dist/*.apk dist/latest.json \
              --title "LapCraft ${{ steps.version.outputs.version_name }}" \
              --notes "Stable build ${{ github.event.inputs.promote_tag }}"
          fi
          gh release edit "$tag" --prerelease=false --latest
